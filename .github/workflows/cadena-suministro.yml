name: Cadena de suministro

# Workflow reutilizable: construye la imagen, genera su SBOM y la escanea. Se consume con
#   jobs:
#     suministro:
#       uses: JesquivelR/pipeline-seguridad-reutilizable/.github/workflows/cadena-suministro.yml@main
#       with:
#         ruta: .
#         imagen: mi-app

on:
  workflow_call:
    inputs:
      ruta:
        description: "Carpeta con el Dockerfile (contexto de build)"
        type: string
        default: "."
      imagen:
        description: "Nombre local de la imagen (sin registro)"
        type: string
        required: true

permissions:
  contents: read

jobs:
  sbom:
    name: Imagen, SBOM y escaneo (Syft, Trivy, Grype)
    runs-on: ubuntu-latest
    env:
      SYFT_VERSION: "1.18.1"
      SYFT_SHA256: "066c251652221e4d44fcc4d115ce3df33a91769da38c830a8533199db2f65aab"
      TRIVY_VERSION: "v0.69.3"
      GRYPE_VERSION: "0.87.0"
      GRYPE_SHA256: "be710d15f5477e5c77ce03d14e480263415d7ab135e04b8483663f688823087d"
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Construir la imagen
        env:
          RUTA: ${{ inputs.ruta }}
          IMAGEN: ${{ inputs.imagen }}
        run: docker build -t "${IMAGEN}:${GITHUB_SHA}" "${RUTA}"

      - name: Instalar Syft verificando el checksum
        run: |
          curl -sSfL -o syft.tar.gz \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  syft.tar.gz" | sha256sum -c -
          tar -xzf syft.tar.gz syft
          sudo install syft /usr/local/bin/syft

      - name: Generar el SBOM en SPDX y CycloneDX
        env:
          IMAGEN: ${{ inputs.imagen }}
        run: |
          mkdir -p sbom
          syft "docker:${IMAGEN}:${GITHUB_SHA}" \
            -o "spdx-json=sbom/${IMAGEN}.spdx.json" \
            -o "cyclonedx-json=sbom/${IMAGEN}.cdx.json"

      - name: Guardar el SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ inputs.imagen }}
          path: sbom/
          if-no-files-found: error

      - name: Escanear la imagen con Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ inputs.imagen }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: ${{ env.TRIVY_VERSION }}
          format: table

      - name: Instalar Grype verificando el checksum
        run: |
          curl -sSfL -o grype.tar.gz \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "${GRYPE_SHA256}  grype.tar.gz" | sha256sum -c -
          tar -xzf grype.tar.gz grype
          sudo install grype /usr/local/bin/grype

      # Segundo escaner con otra base de vulnerabilidades: Grype lee el SBOM
      # generado por Syft y corta si hay hallazgos HIGH o CRITICAL con correccion.
      - name: Escanear el SBOM con Grype
        env:
          IMAGEN: ${{ inputs.imagen }}
        run: grype "sbom:sbom/${IMAGEN}.spdx.json" --only-fixed --fail-on high
