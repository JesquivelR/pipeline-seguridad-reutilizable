name: Seguridad

# Workflow reutilizable: se consume desde otro repositorio con
#   jobs:
#     seguridad:
#       uses: JesquivelR/pipeline-seguridad-reutilizable/.github/workflows/seguridad.yml@main
#       with:
#         lenguaje: java
#         ruta: .

on:
  workflow_call:
    inputs:
      lenguaje:
        description: "Lenguaje principal del proyecto (java, node, python, go, terraform)"
        type: string
        default: "java"
      ruta:
        description: "Ruta del proyecto dentro del repositorio"
        type: string
        default: "."
      umbral-cvss:
        description: "Puntaje CVSS a partir del cual falla Dependency-Check (0 a 10)"
        type: string
        default: "7"
    secrets:
      NVD_API_KEY:
        description: "Llave opcional de la API de la NVD para acelerar la descarga"
        required: false

permissions:
  contents: read

jobs:
  gitleaks:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.21.2"
      GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
    steps:
      - name: Descargar el codigo con todo el historial
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar gitleaks verificando el checksum
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Buscar secretos en el historial
        env:
          RUTA: ${{ inputs.ruta }}
        run: |
          gitleaks detect --source "${RUTA}" --redact --verbose --exit-code 1 \
            --report-format sarif --report-path gitleaks.sarif

      - name: Guardar el reporte
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore

  semgrep:
    name: Analisis estatico (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      SEMGREP_VERSION: "1.99.0"
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Instalar Semgrep
        run: python -m pip install --no-cache-dir "setuptools<70" "semgrep==${SEMGREP_VERSION}"

      - name: Elegir las reglas segun el lenguaje
        id: reglas
        env:
          LENGUAJE: ${{ inputs.lenguaje }}
        run: |
          case "${LENGUAJE}" in
            java)      reglas="p/java p/owasp-top-ten" ;;
            node)      reglas="p/javascript p/nodejs p/owasp-top-ten" ;;
            python)    reglas="p/python p/owasp-top-ten" ;;
            go)        reglas="p/golang p/owasp-top-ten" ;;
            terraform) reglas="p/terraform" ;;
            *)         reglas="p/default" ;;
          esac
          echo "reglas=${reglas}" >> "${GITHUB_OUTPUT}"

      - name: Ejecutar Semgrep
        env:
          RUTA: ${{ inputs.ruta }}
          REGLAS: ${{ steps.reglas.outputs.reglas }}
        run: |
          args=()
          for r in ${REGLAS}; do args+=(--config "${r}"); done
          semgrep scan "${args[@]}" --error --metrics=off \
            --sarif --output semgrep.sarif "${RUTA}"

      - name: Subir el resultado a la pestana Security
        # Code scanning solo esta disponible en repos publicos (o con GHAS).
        if: always() && hashFiles('semgrep.sarif') != '' && !github.event.repository.private
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Guardar el reporte
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore

  dependency-check:
    name: Dependencias vulnerables (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    env:
      DC_VERSION: "11.1.1"
      DC_SHA256: "16f1c9de836a4e7353646d839cce36f0cfaf8db8d834b9eff9976b0854c9c423"
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Restaurar la base de datos de la NVD
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nvd-${{ runner.os }}-

      - name: Instalar Dependency-Check verificando el checksum
        run: |
          curl -sSfL -o dc.zip \
            "https://github.com/jeremylong/DependencyCheck/releases/download/v${DC_VERSION}/dependency-check-${DC_VERSION}-release.zip"
          echo "${DC_SHA256}  dc.zip" | sha256sum -c -
          unzip -q dc.zip -d "${RUNNER_TEMP}"

      - name: Analizar las dependencias
        env:
          RUTA: ${{ inputs.ruta }}
          UMBRAL: ${{ inputs.umbral-cvss }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mkdir -p dependency-check
          # Sonatype OSS Index ahora exige credenciales y hacía fallar el análisis
          # con exit code 14; se desactiva y quedan activos la NVD y el analizador de npm.
          args=(--scan "${RUTA}" --project "${GITHUB_REPOSITORY}" \
            --format HTML --format SARIF --out dependency-check \
            --data "${HOME}/.dependency-check-data" \
            --failOnCVSS "${UMBRAL}" --disableAssembly --disableOssIndex)
          if [ -n "${NVD_API_KEY}" ]; then args+=(--nvdApiKey "${NVD_API_KEY}"); fi
          "${RUNNER_TEMP}/dependency-check/bin/dependency-check.sh" "${args[@]}"

      - name: Guardar el reporte
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-check
          path: dependency-check/
          if-no-files-found: ignore

  trivy:
    name: Vulnerabilidades e IaC (Trivy)
    runs-on: ubuntu-latest
    env:
      TRIVY_VERSION: "v0.69.3"
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy en modo filesystem (dependencias y secretos)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.ruta }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: ${{ env.TRIVY_VERSION }}
          format: table

      - name: Trivy en modo config (Terraform, Kubernetes y Dockerfile)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ inputs.ruta }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          version: ${{ env.TRIVY_VERSION }}
          format: sarif
          output: trivy-config.sarif

      - name: Guardar el reporte
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-config-sarif
          path: trivy-config.sarif
          if-no-files-found: ignore
