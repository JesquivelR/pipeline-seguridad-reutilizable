name: Seguridad

# Workflow reutilizable: se consume desde otro repositorio con
#   jobs:
#     seguridad:
#       uses: JesquivelR/pipeline-seguridad-reutilizable/.github/workflows/seguridad.yml@main
#       with:
#         lenguaje: java
#         ruta: .

on:
  workflow_call:
    inputs:
      lenguaje:
        description: "Lenguaje principal del proyecto (java, node, python, go, terraform)"
        type: string
        default: "java"
      ruta:
        description: "Ruta del proyecto dentro del repositorio"
        type: string
        default: "."

permissions:
  contents: read

jobs:
  gitleaks:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.21.2"
      GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
    steps:
      - name: Descargar el codigo con todo el historial
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar gitleaks verificando el checksum
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Buscar secretos en el historial
        env:
          RUTA: ${{ inputs.ruta }}
        run: |
          gitleaks detect --source "${RUTA}" --redact --verbose --exit-code 1 \
            --report-format sarif --report-path gitleaks.sarif

      - name: Guardar el reporte
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore

  semgrep:
    name: Analisis estatico (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      SEMGREP_VERSION: "1.99.0"
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Preparar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Instalar Semgrep
        run: python -m pip install --no-cache-dir "semgrep==${SEMGREP_VERSION}"

      - name: Elegir las reglas segun el lenguaje
        id: reglas
        env:
          LENGUAJE: ${{ inputs.lenguaje }}
        run: |
          case "${LENGUAJE}" in
            java)      reglas="p/java p/owasp-top-ten" ;;
            node)      reglas="p/javascript p/nodejs p/owasp-top-ten" ;;
            python)    reglas="p/python p/owasp-top-ten" ;;
            go)        reglas="p/golang p/owasp-top-ten" ;;
            terraform) reglas="p/terraform" ;;
            *)         reglas="p/default" ;;
          esac
          echo "reglas=${reglas}" >> "${GITHUB_OUTPUT}"

      - name: Ejecutar Semgrep
        env:
          RUTA: ${{ inputs.ruta }}
          REGLAS: ${{ steps.reglas.outputs.reglas }}
        run: |
          args=()
          for r in ${REGLAS}; do args+=(--config "${r}"); done
          semgrep scan "${args[@]}" --error --metrics=off \
            --sarif --output semgrep.sarif "${RUTA}"

      - name: Subir el resultado a la pestana Security
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@9e8d0789d4a0fa9ceb6b1738f7e269594bdd67f0 # v3.28.9
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Guardar el reporte
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore
